<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richiesta ricevuta — Scelta24</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1729">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;color:#14161C;background:#F5F0E8;padding:24px}
  .wrap{max-width:640px;margin:48px auto;padding:0 16px}
  .card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
  h1{font-size:1.5rem;margin-bottom:12px}
  p{color:#4a4a4a;margin-bottom:16px}
  .ok{color:#166534;font-weight:700;margin-right:8px}
  a.btn{display:inline-block;background:#0F1729;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;margin-top:16px}
  a.btn:hover{background:#1e293b}
  .torna-su {
    position: fixed; bottom: 24px; right: 24px;
    background: #0F1729; color: #fff;
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; font-size: 1.5rem; line-height: 1;
    box-shadow: 0 4px 24px rgba(0,0,0,.15); z-index: 100;
    opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s;
  }
  .torna-su--visibile { opacity: 1; visibility: visible; }
  .torna-su:hover { background: #1e293b; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="ok">&#10004;</span>
    <h1>Richiesta ricevuta</h1>
    <p>Abbiamo ricevuto i tuoi documenti. Li esaminiamo riga per riga e ti rispondiamo entro 24 ore all'indirizzo email che hai indicato.</p>
    <p>Se hai allegato PDF, li trovi nella conferma che ti abbiamo inviato per email.</p>
    <a class="btn" href="index.html">Torna alla pagina principale</a>
  </div>
</div>
  <a class="torna-su" href="#" aria-label="Torna su">&#8593;</a>
  <script>
    (function(){
      var btn=document.querySelector('.torna-su');
      if(!btn) return;
      window.addEventListener('scroll', function(){
        if(window.scrollY>300) btn.classList.add('torna-su--visibile');
        else btn.classList.remove('torna-su--visibile');
      });
      btn.addEventListener('click', function(e){
        e.preventDefault(); window.scrollTo({top:0, behavior:'smooth'});
      });
    })();
  </script>
</body>
</html>
