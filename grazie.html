<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richiesta ricevuta — Scelta24</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1729">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;color:#14161C;background:#F5F0E8;padding:24px}
  .wrap{max-width:640px;margin:48px auto;padding:0 16px}
  .card{background:#fff;border-radius:12px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
  h1{font-size:1.5rem;margin-bottom:12px}
  p{color:#4a4a4a;margin-bottom:16px}
  .ok{color:#166534;font-weight:700;margin-right:8px}
  a.btn{display:inline-block;background:#0F1729;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;margin-top:16px}
  a.btn:hover{background:#1e293b}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="ok">&#10004;</span>
    <h1>Richiesta ricevuta</h1>
    <p>Abbiamo ricevuto i tuoi documenti. Li esaminiamo riga per riga e ti rispondiamo entro 24 ore all'indirizzo email che hai indicato.</p>
    <p>Se hai allegato PDF, li trovi nella conferma che ti abbiamo inviato per email.</p>
    <a class="btn" href="index.html">Torna alla pagina principale</a>
  </div>
</div>
</body>
</html>
